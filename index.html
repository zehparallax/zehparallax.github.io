<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };

  /* ---------------- Ansichtswechsel ---------------- */

  function zeigeAnsicht(id) {
    document.querySelectorAll('main#ansichten .ansicht').forEach(function (ansicht) {
      ansicht.hidden = (ansicht.id !== id);
    });
    window.scrollTo(0, 0);
  }

  var wege = [
    ['btn-zu-regeln', 'ansicht-regeln'],
    ['btn-regeln-zurueck', 'ansicht-setup'],
    ['btn-einrichtung-zurueck', 'ansicht-setup']
  ];
  wege.forEach(function (w) {
    var k = $(w[0]);
    if (k) k.addEventListener('click', function () { zeigeAnsicht(w[1]); });
  });

  /* ---------------- Sprache ---------------- */

  function zeichneSprachliste(filter) {
    var kiste = $('sprache-liste');
    var f = (filter || '').trim().toLowerCase();
    kiste.innerHTML = '';
    REGIONS.filter(function (r) {
      return !f
        || r.country.toLowerCase().indexOf(f) > -1
        || r.label.toLowerCase().indexOf(f) > -1
        || (LANG_NAMES[r.lang] || '').toLowerCase().indexOf(f) > -1
        || r.code.toLowerCase().indexOf(f) > -1;
    }).forEach(function (r) {
      var k = document.createElement('button');
      k.type = 'button';
      k.className = 'sprachzeile';
      k.setAttribute('aria-pressed', String(r.code === I18N.region.code));
      k.innerHTML = '<span class="sprachzeile__flagge">' + r.flag + '</span>' +
        '<span class="sprachzeile__text"><b>' + r.country + '</b>' +
        '<small>' + (LANG_NAMES[r.lang] || r.lang) + '</small></span>' +
        '<span class="sprachzeile__code">' + r.label + '</span>';
      k.addEventListener('click', function () { setzeSprache(r.code); });
      kiste.appendChild(k);
    });
  }

  function setzeSprache(code) {
    try { localStorage.setItem('portriga.sprache', code); } catch (e) {}
    I18N.load(code);
    $('sprachwahl').hidden = true;
    uebernehmeSprache();
  }

  /* Alles neu beschriften. Die Ansichten, die ihre Inhalte selbst erzeugen,
     baut app.js beim nächsten Öffnen ohnehin neu auf. */
  function uebernehmeSprache() {
    I18N.apply();
    $('sprache-flagge').textContent = I18N.region.flag;
    $('sprache-code').textContent = I18N.region.label;
    zeichneEinrichtung();
    if (window.Portriga && Portriga.neuZeichnen) Portriga.neuZeichnen();
  }

  $('btn-sprache').addEventListener('click', function () {
    $('sprache-suche').value = '';
    zeichneSprachliste('');
    $('sprachwahl').hidden = false;
    var aktiv = document.querySelector('.sprachzeile[aria-pressed="true"]');
    if (aktiv) aktiv.scrollIntoView({ block: 'center' });
  });
  $('btn-sprache-zu').addEventListener('click', function () { $('sprachwahl').hidden = true; });
  $('sprachwahl').addEventListener('click', function (e) {
    if (e.target === $('sprachwahl')) $('sprachwahl').hidden = true;
  });
  $('sprache-suche').addEventListener('input', function (e) { zeichneSprachliste(e.target.value); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('sprachwahl').hidden) $('sprachwahl').hidden = true;
  });

  /* ---------------- Einrichtung ---------------- */

  var SCHRITTE = { ios: 4, android: 4, desktop: 4 };
  var installEreignis = null;

  function erkenneSystem() {
    var ua = navigator.userAgent;
    // iPadOS meldet sich seit Version 13 als Mac; einen Mac mit Touch gibt es nicht.
    if (/iPhone|iPad|iPod/.test(ua) || (/Mac/.test(ua) && navigator.maxTouchPoints > 1)) return 'ios';
    if (/Android/.test(ua)) return 'android';
    return 'desktop';
  }
  function istInstalliert() {
    return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  }

  var system = erkenneSystem();

  function zeichneEinrichtung() {
    var knoepfe = $('einr-reiter').querySelectorAll('.reiter__knopf');
    Array.prototype.forEach.call(knoepfe, function (k) {
      k.setAttribute('aria-selected', String(k.dataset.os === system));
    });

    var liste = '';
    for (var i = 1; i <= SCHRITTE[system]; i++) {
      liste += '<li>' + I18N.t('einr.' + system + i) + '</li>';
    }
    $('einr-schritte').innerHTML = liste;
    $('einr-notiz').textContent = I18N.t('einr.' + system + 'Note');
    $('einr-intro').textContent = I18N.t(istInstalliert() ? 'einr.introDone' : 'einr.intro');
    // Knopf nur zeigen, wenn er auch zum tatsächlichen Gerät gehört
    $('btn-einr-installieren').hidden = !installEreignis || system !== erkenneSystem();
  }

  $('einr-reiter').addEventListener('click', function (e) {
    var k = e.target.closest('.reiter__knopf');
    if (!k) return;
    system = k.dataset.os;
    zeichneEinrichtung();
  });

  $('btn-zu-einrichtung').addEventListener('click', function () {
    system = erkenneSystem();
    zeichneEinrichtung();
    zeigeAnsicht('ansicht-einrichtung');
  });

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();               // eigenen Knopf statt Chromes Balken
    installEreignis = e;
    zeichneEinrichtung();
  });
  window.addEventListener('appinstalled', function () {
    installEreignis = null;
    $('btn-einr-installieren').hidden = true;
  });
  $('btn-einr-installieren').addEventListener('click', function () {
    if (!installEreignis) return;
    installEreignis.prompt();
    installEreignis = null;           // verbraucht, ein zweiter Aufruf wirft
    $('btn-einr-installieren').hidden = true;
  });

  /* ---------------- Teilen ---------------- */

  var btnTeilen = $('btn-teilen');
  var hinweisTeilen = $('hinweis-teilen');

  if (btnTeilen) {
    btnTeilen.addEventListener('click', function () {
      var daten = {
        title: 'Portriga',
        text: I18N.t('msg.teilenText'),
        url: window.location.href
      };
      if (navigator.share) {
        navigator.share(daten).catch(function () { /* abgebrochen */ });
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(daten.url).then(function () {
          if (hinweisTeilen) hinweisTeilen.textContent = I18N.t('msg.linkKopiert');
        }).catch(function () {
          if (hinweisTeilen) hinweisTeilen.textContent = daten.url;
        });
      } else {
        window.prompt(daten.url);
      }
    });
  }

  /* ---------------- Start ---------------- */

  var gemerkt = null;
  try { gemerkt = localStorage.getItem('portriga.sprache'); } catch (e) {}
  I18N.load(gemerkt || FALLBACK);
  uebernehmeSprache();
})();
</script>
</body>
</html>
